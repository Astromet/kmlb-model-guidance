name: Update guidance and deploy

on:
  schedule:
    # About 4.5 h after each GFS cycle, when MAV, NBM and ECMWF are all out.
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest model runs
        run: python3 update.py --station KMLB --lat 28.1028 --lon -80.6453 --out data
      - name: Save a data snapshot to the data branch
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models.json previous.json ndfd.json meta.json
          git commit -q -m "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data:data
          rm -rf .git
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
